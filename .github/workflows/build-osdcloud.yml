name: Build Windows installer boot files

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osdcloud-boot-files
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check configuration
        run: ./scripts/Test-Configuration.ps1
      - name: Install ADK and WinPE on the disposable runner
        run: ./scripts/Install-BuildPrerequisites.ps1
      - name: Build the WinPE image
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          ./scripts/Build-OSDCloud.ps1
      - name: Verify and publish boot files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('artifacts/osdcloud/boot.wim', 'artifacts/osdcloud/wimboot', 'artifacts/osdcloud/SHA256SUMS')
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing boot file: $file" }
          }
          $adk = "${env:ProgramFiles(x86)}\Windows Kits\10\Assessment and Deployment Kit"
          & "$adk\Deployment Tools\amd64\DISM\dism.exe" /Get-WimInfo /WimFile:artifacts/osdcloud/boot.wim /Index:1
          if ($LASTEXITCODE -ne 0) { throw 'Invalid boot.wim' }
          $notes = @'
          Windows 10/11 OSDCloud network installer boot files.

          Built on a disposable GitHub-hosted Windows runner from Microsoft ADK/WinPE 10.1.26100.9457, OSD 26.10.6.1 and checksum-pinned wimboot 2.9.0. See SHA256SUMS and the repository build workflow for provenance. The launcher requires interactive confirmation and does not select a target disk automatically.

          Image build and WIM metadata are verified. A complete firmware-to-installer boot is not tested by this workflow.
          '@
          $notes | Set-Content -LiteralPath artifacts/osdcloud/release-notes.txt -Encoding UTF8
          $releases = gh release list --repo "$env:GITHUB_REPOSITORY" --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing releases' }
          if ('osdcloud' -in @($releases.tagName)) { throw 'Release osdcloud already exists; refusing to replace published boot files.' }
          gh release create osdcloud @files --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title 'Windows 10/11 OSDCloud boot files' --notes-file artifacts/osdcloud/release-notes.txt --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Boot file publication failed' }
