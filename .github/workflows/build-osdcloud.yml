name: Build Windows installer boot files

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  OSDCLOUD_RELEASE_TAG: osdcloud-v3

concurrency:
  group: osdcloud-boot-files
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check configuration
        run: ./scripts/Test-Configuration.ps1
      - name: Install ADK and WinPE on the disposable runner
        run: ./scripts/Install-BuildPrerequisites.ps1
      - name: Build the WinPE image
        run: |
          Install-PackageProvider -Name NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
          ./scripts/Get-WinPEVirtualDrivers.ps1 -DestinationPath .build/virtual-drivers
          ./scripts/Build-OSDCloud.ps1 -DriverPath .build/virtual-drivers
      - name: Verify and publish boot files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('artifacts/osdcloud/boot.wim', 'artifacts/osdcloud/wimboot', 'artifacts/osdcloud/BCD', 'artifacts/osdcloud/boot.sdi', 'artifacts/osdcloud/SHA256SUMS', 'artifacts/osdcloud/virtual-drivers.json')
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing boot file: $file" }
          }
          $adk = "${env:ProgramFiles(x86)}\Windows Kits\10\Assessment and Deployment Kit"
          & "$adk\Deployment Tools\amd64\DISM\dism.exe" /Get-WimInfo /WimFile:artifacts/osdcloud/boot.wim /Index:1
          if ($LASTEXITCODE -ne 0) { throw 'Invalid boot.wim' }
          $notes = @'
          Windows 10/11 OSDCloud network installer boot files.

          Built on a disposable GitHub-hosted Windows runner from Microsoft ADK/WinPE 10.1.26100.9457, OSD 26.10.6.1 and checksum-pinned wimboot 2.9.0. See SHA256SUMS and the repository build workflow for provenance. The launcher requires interactive confirmation and does not select a target disk automatically.

          Includes matching BCD/boot.sdi, signed x64 VirtIO SCSI/Block/NetKVM and VMware PVSCSI/VMXNET3 drivers from checksum-pinned Microsoft Update CABs (see virtual-drivers.json), plus PowerShellGet 2.2.5, PackageManagement 1.4.8.1 and the NuGet provider. Subsequent BIOS/UEFI device tests verify disk detection, networking and read-only Find-Module without starting a deployment. Check their results before using this release.
          '@
          $notes | Set-Content -LiteralPath artifacts/osdcloud/release-notes.txt -Encoding UTF8
          $releases = gh release list --repo "$env:GITHUB_REPOSITORY" --limit 100 --json tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing releases' }
          if ($env:OSDCLOUD_RELEASE_TAG -in @($releases.tagName)) { throw 'Release already exists; refusing to replace published boot files.' }
          gh release create "$env:OSDCLOUD_RELEASE_TAG" @files --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title 'Windows 10/11 OSDCloud boot files v3' --notes-file artifacts/osdcloud/release-notes.txt --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Boot file publication failed' }

  boot-smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {firmware: bios, devices: sata}
          - {firmware: uefi, devices: sata}
          - {firmware: uefi, devices: virtio-scsi}
          - {firmware: uefi, devices: virtio-blk}
          - {firmware: uefi, devices: vmware}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install disposable VM test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf ipxe tesseract-ocr
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Download the boot files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$OSDCLOUD_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts/osdcloud
      - name: Boot WinPE without starting a deployment
        run: python -u -m tools.test_winpe_boot artifacts/osdcloud --firmware "${{ matrix.firmware }}" --devices "${{ matrix.devices }}"
      - name: Save boot test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: winpe-${{ matrix.firmware }}-${{ matrix.devices }}-evidence
          include-hidden-files: true
          path: |
            .build/winpe-smoke*/*.png
            .build/winpe-smoke*/*.txt
            .build/winpe-smoke*/*.log
